<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a59f7">
<title>Horizon · 日报与电源课</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">⚡ Horizon</div>
  <div class="date" id="hdr-date">…</div>
  <button class="iconbtn" id="theme-btn" aria-label="主题">🌙</button>
</header>

<main id="main">
  <!-- ============ 日报 tab ============ -->
  <section id="view-report" class="view">
    <div class="feeddate" id="feed-date">加载中…</div>
    <div class="chips" id="board-chips"></div>
    <div id="board-list"></div>
    <div class="err" id="feed-err" hidden></div>
  </section>

  <!-- ============ 课程 tab ============ -->
  <section id="view-lesson" class="view" hidden>
    <div class="err" id="lesson-err" hidden></div>
    <div id="lesson-today"></div>
    <div class="lesson-outline-head">课程大纲 <span class="sub" id="lesson-count"></span></div>
    <div id="lesson-outline"></div>
    <div class="sub" style="text-align:center;margin:14px 0 6px">—— 以下为系列预告 ——</div>
    <div class="sub" style="text-align:center;margin:0 0 10px" id="lesson-tail"></div>
  </section>

  <!-- ============ 我的 tab ============ -->
  <section id="view-me" class="view" hidden>
    <div class="card">
      <div class="me-title">学习进度</div>
      <div class="me-stats" id="me-stats"></div>
      <div class="stagebars" id="stage-bars"></div>
    </div>
    <div class="card">
      <div class="me-title">设置</div>
      <div class="me-row"><span>深色模式</span>
        <select id="theme-select">
          <option value="auto">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option
        </select>
      </div>
      <div class="me-row"><span>清除本地缓存</span><button class="mini" id="btn-clear">清除</button></div>
      <div class="me-row"><span>Web 版日报</span><a href="/reports-html/index.html">打开 ↗</a></div>
      <div class="me-row"><span>关于</span><span class="sub">Horizon App · 数据来自 horizon.pyyaiai.com</span></div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="report"><span class="ticon">📰</span><span>日报</span></button>
  <button class="tab" data-view="lesson"><span class="ticon">⚡</span><span>课程</span></button>
  <button class="tab" data-view="me"><span class="ticon">📈</span><span>我的</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
